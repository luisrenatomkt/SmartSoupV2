name: Build SmartSoup

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('build.gradle') }}
          restore-keys: gradle-

      - name: Instalar Gradle 2.14.1 (exigido pelo ForgeGradle 2.1)
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip -d "$HOME"
          echo "$HOME/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Compilar
        run: gradle setupDecompWorkspace build --no-daemon

      - name: Enviar o jar
        uses: actions/upload-artifact@v4
        with:
          name: SmartSoup-1.0.0
          path: build/libs/SmartSoup-1.0.0.jar
          if-no-files-found: error
